name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholders. The frontend reads these at build time, and
      # `next build` fails without them. No real secrets: CI never talks to
      # Supabase or Stripe.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://remotedevsbr.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: the repo currently has ~204 pre-existing ESLint
      # errors (mostly no-explicit-any). Drop continue-on-error once they are
      # cleared so lint becomes a real gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy functions and push DB
    needs: verify
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: v2.116.0

      - name: Link project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: |
          supabase db push --dry-run

      - name: Push database migrations
        run: |
          supabase db push

      - name: Deploy all edge functions
        run: |
          supabase functions deploy
